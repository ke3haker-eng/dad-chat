<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحاضرة المباشرة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f3fa8">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1b1f3b;--mu:#6b7090;--pr:#3f3fa8;--lec:#e8f0ff;--stu:#fff;--bd:#e2e4f0}
[data-t=dark]{--bg:#0f1226;--card:#181c36;--tx:#eceefb;--mu:#9aa0c4;--pr:#8b8bff;--lec:#232a5c;--stu:#1f2442;--bd:#2a3058}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0f1226;--card:#181c36;--tx:#eceefb;--mu:#9aa0c4;--pr:#8b8bff;--lec:#232a5c;--stu:#1f2442;--bd:#2a3058}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;position:relative;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.scr{position:absolute;inset:0}
.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
h1{margin:0;color:var(--pr)}h2{margin:0;font-size:1.05rem}p{margin:0;color:var(--mu)}small{color:var(--mu)}
.logo{font-size:3rem}
.pb{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:10px 22px;min-height:44px;cursor:pointer}
[data-t=dark] .pb{color:#0f1226}
.pb:disabled{opacity:.5;cursor:not-allowed}
.sb{background:none;border:1px solid var(--bd);border-radius:12px;padding:10px 22px;min-height:44px;cursor:pointer}
.dg{border-color:#dc2626;color:#dc2626}
input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;max-width:340px}
.ic{background:none;border:0;font-size:1.3rem;min-width:44px;min-height:44px;cursor:pointer}
.top{position:absolute;top:8px;inset-inline-end:8px}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
#chat{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:2px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.ti{flex:1;min-width:0;display:flex;flex-direction:column}.ti b,.ti small{overflow-wrap:anywhere;line-height:1.3}.ti{padding:4px 0}
.st{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bd);white-space:nowrap}
.st.on{background:#dcfce7;color:#166534}
.pbar{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.chip{flex:none;max-width:75%;font-size:.8rem;border:1px solid var(--bd);border-radius:10px;padding:4px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{padding:10px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.sp>div{display:flex;gap:8px;align-items:center}.sp input[type=text]{max-width:none}
main{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.dt{align-self:center;font-size:.75rem;color:var(--mu);margin:6px}
.m{max-width:85%;align-self:flex-start;background:var(--stu);border:1px solid var(--bd);border-radius:14px;padding:6px 10px;overflow-wrap:anywhere}
.m.lec{background:var(--lec);border-color:var(--pr)}.m.mine{align-self:flex-end}
.meta{font-size:.75rem;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:var(--pr);color:#fff;border-radius:6px;padding:0 6px}[data-t=dark] .tag{color:#0f1226}
.q{border-inline-start:3px solid var(--pr);padding:2px 8px;font-size:.8rem;color:var(--mu);cursor:pointer;margin:4px 0}
.bd{white-space:pre-wrap}a{color:var(--pr)}
.acts{display:flex;gap:12px;flex-wrap:wrap}.acts button{background:none;border:0;color:var(--pr);font-size:.75rem;padding:6px 0;cursor:pointer}
.pend{opacity:.75;border-style:dashed}
.fb{display:flex;gap:8px;flex-wrap:wrap;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.chip2{border:1px solid var(--bd);background:none;border-radius:99px;padding:4px 14px;font-size:.8rem;cursor:pointer}
.chip2.on{background:var(--pr);color:#fff;border-color:var(--pr)}[data-t=dark] .chip2.on{color:#0f1226}
.fl{outline:2px solid var(--pr)}
.rp{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--card);border-top:1px solid var(--bd);font-size:.85rem}

footer textarea{max-width:none;resize:none;max-height:120px}
#ins{position:fixed;bottom:0;inset-inline:0;z-index:8;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--pr);color:#fff;box-shadow:0 -2px 12px #0004}

#ins span{flex:1;font-size:.9rem}
#ins button{border:0;border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
#ib{background:#fff;color:#3f3fa8;font-weight:700}#ix{background:none;color:inherit;font-size:1.1rem}
#toast{position:fixed;bottom:80px;inset-inline:16px;margin:auto;width:fit-content;max-width:90%;background:#222;color:#fff;border-radius:10px;padding:8px 14px;z-index:9}
</style>
</head>
<body>

<section id="home" class="scr ctr">
  <button id="th" class="ic top" aria-label="تبديل المظهر">◐</button>
  <div class="logo">🎓</div>
  <h1>المحاضرة المباشرة</h1>
  <h2>مرحبًا بك في مساحة المحاضرة</h2>
  <p>تواصل مباشرة مع المحاضر وشارك في النقاش</p>
  <button id="bs" class="pb">دخول الطالب</button>
  <button id="bl" class="sb">دخول المحاضر</button>
  <small>الجلسة المجهولة قد لا تُستعاد على جهاز آخر أو بعد مسح بيانات المتصفح، والاسم المجهول لا يعني انعدام إمكانية التتبع التقني.</small>
</section>

<section id="login" class="scr ctr hide">
  <h1>دخول المحاضر</h1>
  <input id="em" type="email" dir="ltr" autocomplete="username" placeholder="البريد الإلكتروني">
  <input id="pw" type="password" dir="ltr" autocomplete="current-password" placeholder="كلمة المرور">
  <button id="go" class="pb">دخول</button>
  <button id="bk" class="sb">رجوع</button>
</section>

<section id="chat" class="scr hide">
  <header>
    <button id="back" class="ic" aria-label="تسجيل الخروج" title="تسجيل الخروج">⎋</button>
    <div class="ti"><b id="rt"></b><small id="rl"></small></div>
    <span id="cn" class="st"></span><span id="ws" class="st"></span>
    <button id="gear" class="ic hide" aria-label="الإعدادات">⚙</button>
  </header>
  <div class="fb"><button id="flt" class="chip2">رسائل المحاضر فقط</button><button id="bell" class="chip2 hide">🔔 تفعيل الإشعارات</button></div>
  <div id="pbar" class="pbar hide"></div>
  <div id="sp" class="sp hide">
    <div><input id="tw" type="checkbox"><label for="tw">السماح للطلاب بالكتابة</label></div>
    <div><input id="nm" type="text" maxlength="60" placeholder="اسم المحاضر الظاهر"><button id="nms" class="pb">حفظ</button></div>
    <div><button id="clr" class="sb dg">مسح المحادثة</button></div>
  </div>
  <main id="ms"></main>
  <div id="rp" class="rp hide"></div>
  <footer>
    <button id="att" class="ic" aria-label="إرفاق ملف">📎</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" class="hide">
    <textarea id="in" rows="1" maxlength="1000" placeholder="اكتب رسالتك…"></textarea>
    <button id="send" class="pb">إرسال</button>
  </footer>
</section>
<div id="ins" class="hide"><span id="it"></span><button id="ib">تثبيت</button><button id="ix" aria-label="إغلاق">✕</button></div>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========== 1. الإعدادات (ضع قيمك هنا — المفتاح العام فقط) ========== */
const SUPABASE_URL = 'https://vnmpjfleinsrlxgatrvv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iy85yxqXbDmJ8u7TmvpeTA_9nbagek5';

  : s.includes('file_too_big') ? 'حجم الملف أكبر من المسموح' : s.includes('rate_limited') ? 'أرسلت رسائل كثيرة، انتظر قليلًا' : s.includes('duplicate') ? 'هذه الرسالة أُرسلت للتو'

}
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
/* المظهر */
const applyTheme = v => { v ? document.documentElement.dataset.t = v : delete document.documentElement.dataset.t; };
try { applyTheme(localStorage.getItem('t')); } catch {}
$('#th').onclick = () => { const d = (document.documentElement.dataset.t || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark'; applyTheme(d); try { localStorage.setItem('t', d); } catch {} };

/* ========== 3. Supabase والحالة ========== */
if (!window.supabase) document.body.prepend('تعذّر تحميل مكتبة Supabase');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { user: null, lec: false, room: null, msgs: new Map(), pins: new Map(), pm: new Map(), reply: null, chan: null, oldest: null, more: true, sending: false, down: false, out: [], flushing: false, busy: false, onlyLec: false, lm: new Map() };
const show = id => ['home', 'login', 'chat'].forEach(x => $('#' + x).classList.toggle('hide', x !== id));

/* ========== 4. المصادقة ========== */
async function enterStudent() {
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (session && !session.user.is_anonymous) { await sb.auth.signOut(); session = null; }
    if (!session) { const { error } = await sb.auth.signInAnonymously(); if (error) throw error; }
    await openChat();
  } catch (e) { fail('تعذّر الدخول كطالب. تأكد من تفعيل الدخول المجهول', e); }
}
async function lecturerLogin() {
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) throw error;
    const { data } = await sb.rpc('is_lecturer');
    if (data !== true) { await sb.auth.signOut(); return toast('هذا الحساب ليس حساب محاضر'); }
    $('#pw').value = ''; await openChat();
  } catch (e) { fail('بيانات الدخول غير صحيحة', e); }
}

/* ========== 5. تحميل البيانات ========== */
async function openChat() {
  const { data: { session } } = await sb.auth.getSession(), user = session.user, prev = ls.get('cu', null);
  if (prev && prev.id !== user.id) { ls.del('cache'); ls.del('ob'); }
  S.user = user; S.lec = (await sb.rpc('is_lecturer')).data === true; ls.set('cu', { id: user.id, lec: S.lec }); S.out = ls.get('ob', []);
  S.msgs.clear(); S.oldest = null; S.more = true; clearReply();
  $('#gear').classList.toggle('hide', !S.lec); $('#sp').classList.add('hide');
  show('chat');
  await Promise.all([loadRoom(), loadPins()]); await loadMsgs(); subscribe(); S.down = false; flush(); pushOn(false).catch(console.error);
}
async function loadRoom() {
  const { data, error } = await sb.from('chat_rooms').select('*').eq('id', ROOM).single();
  if (error) throw error; S.room = data; renderHead();
}
async function loadMsgs(older = false) {
  try {
    let q = sb.from('messages').select('*').eq('room_id', ROOM).order('created_at', { ascending: false }).limit(PAGE);
    if (older && S.oldest) q = q.lt('created_at', S.oldest);
    const { data, error } = await q; if (error) throw error;
    data.forEach(m => S.msgs.set(m.id, m));
    if (older) S.more = data.length === PAGE;
    if (data.length && (!S.oldest || older)) S.oldest = data[data.length - 1].created_at;
    const box = $('#ms'), ph = box.scrollHeight; render(!older);
    if (older) box.scrollTop = box.scrollHeight - ph;
  } catch (e) { fail('تعذّر تحميل الرسائل', e); }
}
async function loadPins() {
  const { data, error } = await sb.from('pinned_messages').select('*').eq('room_id', ROOM).order('pinned_at'); if (error) throw error;
  S.pins = new Map((data || []).map(p => [p.id, p]));
  const ids = [...new Set((data || []).map(p => p.message_id))];
  if (ids.length) { const { data: ms } = await sb.from('messages').select('*').in('id', ids); (ms || []).forEach(m => S.pm.set(m.id, m)); }
  renderPins();
}
async function resync() { try { await Promise.all([loadRoom(), loadPins()]); await loadMsgs(); S.down = false; } catch (e) { console.error(e); } }

/* ========== 6. Realtime (قناة واحدة) ========== */
function subscribe() {
  if (S.chan) sb.removeChannel(S.chan);

    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, onMsg)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pinned_messages' }, onPin)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_rooms' }, p => {
      if (p.new.id !== ROOM) return;

      if (was !== undefined && was !== p.new.students_can_write && !S.lec) toast(p.new.students_can_write ? 'تم السماح بالكتابة' : 'تم إيقاف الكتابة من المحاضر');

function unsubscribe() { if (S.chan) { sb.removeChannel(S.chan); S.chan = null; } }
function onMsg({ eventType: t, new: n, old: o }) {
  if (t === 'DELETE') { S.msgs.delete(o.id); S.lm.delete(o.id); for (const [k, v] of S.pins) if (v.message_id === o.id) S.pins.delete(k); }

  render();
}
async function onPin({ eventType: t, new: n, old: o }) {
  if (t === 'DELETE') S.pins.delete(o.id);
  else if (n.room_id === ROOM) {
    S.pins.set(n.id, n);
    if (!S.msgs.has(n.message_id) && !S.pm.has(n.message_id)) { const { data } = await sb.from('messages').select('*').eq('id', n.message_id).single(); if (data) S.pm.set(data.id, data); }
  }
  render();
}
function setConn(st) {
  const c = $('#cn'), ok = st === 'SUBSCRIBED';
  c.textContent = ok ? 'متصل' : st === 'CONNECTING' || st === 'JOINING' ? 'جارٍ الاتصال' : 'غير متصل';
  c.classList.toggle('on', ok);
}
addEventListener('offline', () => { S.down = true; setConn('CLOSED'); });
addEventListener('online', () => { if (S.user) connect(); });

/* ========== 7. الواجهة ========== */
function renderHead() {

  ws.textContent = w ? 'الكتابة مفتوحة' : 'الكتابة متوقفة'; ws.classList.toggle('on', w);

const isPinned = id => [...S.pins.values()].some(p => p.message_id === id);

    m.reply_to_message_id ? h('div', { class: 'q', onclick: () => jump(m.reply_to_message_id) }, r ? r.sender_display_name + ': ' + cut(r.content) : 'الرسالة الأصلية غير متاحة') : null,
    m.content && !(m.attachment_path && m.content === '📎 ' + m.attachment_name) ? h('div', { class: 'bd' }, linkify(m.content)) : null, m.attachment_path ? attNode(m) : null,
    h('div', { class: 'acts' }, btn('رد', () => setReply(m)), btn('نسخ', () => navigator.clipboard?.writeText(m.content).then(() => toast('تم النسخ'))),
      lb(pinned ? 'إلغاء التثبيت' : 'تثبيت', () => togglePin(m)), S.lec && mine ? btn('تعديل', () => editMsg(m)) : null, (S.lec || mine) ? btn('حذف', () => delMsg(m)) : null));
}
function render(stick = true) {
  const box = $('#ms'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120; let d = '';

    const day = new Date(m.created_at).toLocaleDateString('ar'); if (day !== d) { d = day; box.append(h('div', { class: 'dt' }, day)); }
    box.append(node(m));

  if (S.onlyLec && !box.children.length) box.append(h('div', { class: 'dt' }, 'لا توجد رسائل من المحاضر بعد'));

  if (stick && near) box.scrollTop = box.scrollHeight; renderPins(); saveCache();
}
function renderPins() {
  const bar = $('#pbar'), ps = [...S.pins.values()].filter(p => pinMsg(p.message_id));
  bar.classList.toggle('hide', !ps.length); bar.replaceChildren();
  ps.forEach(p => { const m = pinMsg(p.message_id); bar.append(h('div', { class: 'chip', onclick: () => jump(m.id) }, '📌 ' + m.sender_display_name + ' · ' + new Date(m.created_at).toLocaleDateString('ar') + ': ' + cut(m.content))); });
}
function jump(id) { const e = document.getElementById('m' + id); if (!e) return toast('الرسالة غير محملة، مرر للأعلى لتحميل الأقدم'); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); e.classList.add('fl'); setTimeout(() => e.classList.remove('fl'), 1500); }
function setReply(m) {
  if (!S.lec && !S.room.students_can_write) return toast('الكتابة متوقفة حاليًا من قِبل المحاضر');
  S.reply = m; const r = $('#rp'); r.classList.remove('hide'); r.replaceChildren(h('span', {}, 'رد على ' + m.sender_display_name + ': ' + cut(m.content)), h('button', { class: 'ic', onclick: clearReply, 'aria-label': 'إلغاء الرد' }, '✕')); $('#in').focus();
}
function clearReply() { S.reply = null; $('#rp').classList.add('hide'); }

/* ========== 8. الإرسال والإدارة ========== */
function send(att) {
  const ta = $('#in'); let txt = ta.value.trim(); if (!txt && !att) return; if (!txt) txt = '📎 ' + att.name;
  if (!S.lec && !S.room?.students_can_write) return toast('الكتابة متوقفة حاليًا من قِبل المحاضر');
  S.out.push({ id: crypto.randomUUID(), content: txt, reply: S.reply?.id || null, att: att || null }); ls.set('ob', S.out);
  ta.value = ''; ta.style.height = 'auto'; clearReply(); render(); $('#ms').scrollTop = 1e9; flush();
}
function pend(o) {
  return h('div', { class: 'm mine pend' },
    h('div', { class: 'meta' }, h('b', {}, 'أنت'), h('span', {}, o.err ? '⚠ ' + o.err : '⏳ بانتظار الإرسال')),
    h('div', { class: 'bd' }, linkify(o.content)), o.att ? h('div', {}, '📎 ' + o.att.name) : null,
    h('div', { class: 'acts' }, o.err ? btn('إعادة المحاولة', () => { delete o.err; ls.set('ob', S.out); render(); flush(); }) : null,
      btn('حذف', () => { S.out = S.out.filter(x => x !== o); ls.set('ob', S.out); render(); })));
}
async function flush() { // يرسل الرسائل المعلّقة بالترتيب؛ المعرّف المولَّد محليًا يمنع التكرار
  if (S.flushing || !S.out.length || !navigator.onLine || !S.user) return; S.flushing = true;
  try {
    const { data: { session } } = await sb.auth.getSession(); if (!session) return;
    for (const o of [...S.out]) {
      if (o.err) continue;
      const row = r => sb.from('messages').insert({ id: o.id, room_id: ROOM, content: o.content, ...(r ? { reply_to_message_id: r } : {}), ...(o.att ? { attachment_path: o.att.path, attachment_name: o.att.name, attachment_type: o.att.type, attachment_size: o.att.size } : {}) }).select().single();
      let { data, error } = await row(o.reply);
      if (error?.code === '23503' && o.reply) ({ data, error } = await row(null));
      if (error?.code === '23505') { ({ data } = await sb.from('messages').select('*').eq('id', o.id).single()); error = null; }
      if (error) {
        if (!error.code || /fetch|network/i.test(error.message)) { S.down = true; setConn('CLOSED'); break; }
        if (/rate_limited/.test(error.message)) { setTimeout(flush, 4000); break; }
        o.err = errText(error); ls.set('ob', S.out); render(); continue;
      }
      S.out = S.out.filter(x => x.id !== o.id); ls.set('ob', S.out); if (data) S.msgs.set(data.id, data); render();
    }
  } catch (e) { console.error(e); } finally { S.flushing = false; }
}
async function togglePin(m) {
  try {
    const p = [...S.pins.values()].find(x => x.message_id === m.id);
    const { error } = p ? await sb.from('pinned_messages').delete().eq('id', p.id) : await sb.from('pinned_messages').insert({ room_id: ROOM, message_id: m.id });
    if (error) throw error; await loadPins(); render();
  } catch (e) { fail(errText(e), e); }
}
async function editMsg(m) {
  const v = prompt('تعديل الرسالة', m.content); if (v === null || !v.trim() || v.trim() === m.content) return;
  const { data, error } = await sb.from('messages').update({ content: v.trim() }).eq('id', m.id).select().single();
  if (error) return fail(errText(error), error); S.msgs.set(data.id, data); render();
}
async function delMsg(m) {
  if (!confirm('حذف هذه الرسالة نهائيًا؟')) return;
  const { error } = await sb.from('messages').delete().eq('id', m.id); if (error) return fail(errText(error), error);
  if (m.attachment_path) sb.storage.from('chat-files').remove([m.attachment_path]).catch(console.error);
  S.msgs.delete(m.id); S.lm.delete(m.id); for (const [k, v] of S.pins) if (v.message_id === m.id) S.pins.delete(k); render();
}
async function updateRoom(patch) {
  const { error } = await sb.from('chat_rooms').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', ROOM);
  if (error) { fail(errText(error), error); await loadRoom(); } else Object.assign(S.room, patch), renderHead();
}
async function clearChat() {
  if (!confirm('سيتم حذف جميع الرسائل والتثبيتات، وتبقى الغرفة وإعداداتها. متأكد؟')) return;
  const { error } = await sb.rpc('clear_chat', { p_room: ROOM }); if (error) return fail(errText(error), error);
  S.msgs.clear(); S.pins.clear(); S.pm.clear(); S.oldest = null; render(); toast('تم مسح المحادثة');
}

/* ========== 9. ربط الأحداث ========== */
$('#bs').onclick = enterStudent;
$('#bl').onclick = () => show('login');
$('#bk').onclick = () => show('home');
$('#go').onclick = lecturerLogin;
$('#pw').onkeydown = e => { if (e.key === 'Enter') lecturerLogin(); };
$('#back').onclick = () => { if (confirm(S.out.length ? 'لديك رسائل لم تُرسل بعد وستضيع عند الخروج. تسجيل الخروج؟' : 'تسجيل الخروج من التطبيق؟')) doLogout(); };
$('#send').onclick = () => send();
$('#att').onclick = () => $('#file').click();
$('#file').onchange = e => { attach(e.target.files[0]); e.target.value = ''; };
$('#in').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
$('#in').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; };
$('#gear').onclick = () => $('#sp').classList.toggle('hide');
$('#tw').onchange = e => updateRoom({ students_can_write: e.target.checked });
$('#nms').onclick = () => { const v = $('#nm').value.trim(); if (v) updateRoom({ lecturer_display_name: v }); };
$('#clr').onclick = clearChat;
$('#ms').addEventListener('scroll', e => { if (e.target.scrollTop < 40 && S.more && S.oldest) { S.more = false; loadMsgs(true); } }, { passive: true });

/* ========== 10. تثبيت التطبيق (PWA) ========== */
let dip = null, insT;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function showIns(msg, can) {
  if (standalone()) return;
  $('#it').textContent = msg; $('#ib').classList.toggle('hide', !can); $('#ins').classList.remove('hide');
  clearTimeout(insT); insT = setTimeout(() => $('#ins').classList.add('hide'), 10000);
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; showIns('ثبّت التطبيق على هاتفك للوصول السريع', true); });
addEventListener('appinstalled', () => { dip = null; $('#ins').classList.add('hide'); });
if (/iphone|ipad|ipod/i.test(navigator.userAgent)) showIns('للتثبيت: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»', false);
$('#ib').onclick = async () => { if (!dip) return; dip.prompt(); await dip.userChoice; dip = null; $('#ins').classList.add('hide'); };
$('#ix').onclick = () => $('#ins').classList.add('hide');
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));

/* ========== 10ث. الإشعارات (Web Push) ========== */
const VAPID = 'BM0zV7icdn3Fzey755zhySuAcfKuE1y5bNOrJWGJS7F81yU71GBG0NenbBMssa0Ji4KkqZ3reqV9lAdgNV5Vq1Y';
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const u8 = b => Uint8Array.from(atob((b + '='.repeat((4 - b.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pushOn(ask) { // يشترك الجهاز ويحفظ الاشتراك باسم المستخدم الحالي
  if (!pushOK) return false;
  if (Notification.permission === 'default' && ask) await Notification.requestPermission();
  if (Notification.permission !== 'granted') return false;
  const reg = await navigator.serviceWorker.ready; let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const { data, error } = await sb.from('push_subscriptions').select('endpoint').eq('endpoint', sub.endpoint); if (error) throw error;
    if (data.length) { $('#bell').classList.add('hide'); return true; }
    await sub.unsubscribe(); // اشتراك قديم لمستخدم آخر
  }
  sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(VAPID) });
  const j = sub.toJSON(), { error } = await sb.from('push_subscriptions').insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
  if (error) throw error; $('#bell').classList.add('hide'); return true;
}
async function pushOff() {
  if (!pushOK) return;
  try { await Promise.race([(async () => { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } })(), new Promise(r => setTimeout(r, 3000))]); } catch (e) { console.error(e); }
}
if (pushOK && Notification.permission !== 'granted') $('#bell').classList.remove('hide');
$('#bell').onclick = async () => {
  if (Notification.permission === 'denied') return toast('الإشعارات محظورة. فعّلها من إعدادات الموقع في Chrome');
  try { if (await pushOn(true)) toast('تم تفعيل الإشعارات'); } catch (e) { fail('تعذّر تفعيل الإشعارات', e); }
};

/* ========== 10أ. فلتر رسائل المحاضر ========== */
function srcList() { // الوضع المفلتر: رسائل المحاضر المحمّلة + ما جلبناه من الخادم
  if (!S.onlyLec) return [...S.msgs.values()];
  return [...new Map([...S.lm, ...[...S.msgs].filter(([, m]) => m.sender_role === 'lecturer')]).values()];
}
async function loadLec() {
  if (!navigator.onLine) return;
  const { data, error } = await sb.from('messages').select('*').eq('room_id', ROOM).eq('sender_role', 'lecturer').order('created_at', { ascending: false }).limit(100);
  if (error) return console.error(error);
  S.lm = new Map(data.map(m => [m.id, m])); render(); $('#ms').scrollTop = 1e9;
}
$('#flt').onclick = () => {
  S.onlyLec = !S.onlyLec; const b = $('#flt');
  b.classList.toggle('on', S.onlyLec); b.textContent = S.onlyLec ? '✓ رسائل المحاضر فقط' : 'رسائل المحاضر فقط';
  render(); $('#ms').scrollTop = 1e9; if (S.onlyLec) loadLec();
};

/* ========== 10ب. المرفقات ========== */
const urls = new Map();
async function sign(p) { // روابط مؤقتة لأن المخزن خاص
  const c = urls.get(p); if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await sb.storage.from('chat-files').createSignedUrl(p, 3600); if (error) throw error;
  urls.set(p, { url: data.signedUrl, exp: Date.now() + 3300000 }); return data.signedUrl;
}
function attNode(m) {
  const a = h('a', { target: '_blank', rel: 'noopener noreferrer' });
  if (m.attachment_type === 'application/pdf') a.append('📄 ' + m.attachment_name + ' (' + Math.max(1, Math.round(m.attachment_size / 1024)) + ' ك.ب)');
  else a.append(h('img', { alt: m.attachment_name, loading: 'lazy', style: 'max-width:100%;max-height:260px;border-radius:10px;display:block' }));
  sign(m.attachment_path).then(u => { a.href = u; const i = a.querySelector('img'); if (i) i.src = u; }).catch(() => a.append(' ⚠'));
  return a;
}
async function shrink(f) { // ضغط الصور قبل الرفع
  const b = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
  c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(b, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .8));
}
async function attach(f) {
  if (!f) return;
  if (!navigator.onLine) return toast('رفع الملفات يحتاج اتصالًا بالإنترنت');
  if (!S.lec && !S.room?.students_can_write) return toast('الكتابة متوقفة حاليًا من قِبل المحاضر');
  const pdf = f.type === 'application/pdf';
  if (!pdf && !/^image\/(jpeg|png|webp)$/.test(f.type)) return toast('المسموح: صور JPG/PNG/WebP وملفات PDF');
  const lim = S.lec ? 10485760 : 5242880;
  try {
    toast('جارٍ رفع الملف…');
    const blob = pdf ? f : await shrink(f);
    if (blob.size > lim) return toast('حجم الملف أكبر من المسموح (' + lim / 1048576 + ' ميغابايت)');
    const type = pdf ? 'application/pdf' : 'image/jpeg', path = S.user.id + '/' + crypto.randomUUID() + (pdf ? '.pdf' : '.jpg');
    const { error } = await sb.storage.from('chat-files').upload(path, blob, { contentType: type }); if (error) throw error;
    send({ path, name: f.name.slice(0, 200), type, size: blob.size });
  } catch (e) { fail('تعذّر رفع الملف', e); }
}

/* ========== 11. العمل دون اتصال والجلسة الدائمة ========== */
const byT = (a, b) => new Date(a.created_at) - new Date(b.created_at);
function saveCache() { if (S.room) ls.set('cache', { room: S.room, msgs: [...S.msgs.values()].sort(byT).slice(-100), pins: [...S.pins.values()], pm: [...S.pm.values()] }); }
async function connect() { // يربط الجلسة المحفوظة بالخادم ويزامن؛ يفشل بهدوء دون إنترنت
  if (S.busy || !S.user) return; S.busy = true;
  try {
    const { data: { session }, error } = await sb.auth.getSession(); if (error) throw error;
    if (!session) { await doLogout(); return toast('انتهت الجلسة، سجّل الدخول من جديد'); }
    const r = await sb.rpc('is_lecturer'); if (r.error) throw r.error;
    S.user = session.user; S.lec = r.data === true; ls.set('cu', { id: S.user.id, lec: S.lec }); $('#gear').classList.toggle('hide', !S.lec);
    await Promise.all([loadRoom(), loadPins()]); await loadMsgs(); subscribe(); S.down = false; flush(); pushOn(false).catch(console.error);
  } catch (e) { console.error(e); S.down = true; setConn('CLOSED'); } finally { S.busy = false; }
}
async function doLogout() {
  unsubscribe(); await pushOff(); try { await Promise.race([sb.auth.signOut({ scope: 'local' }), new Promise(r => setTimeout(r, 3000))]); } catch {}
  try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch {}
  ['cu', 'cache', 'ob'].forEach(k => ls.del(k)); S.user = null; S.out = []; S.msgs.clear(); S.pins.clear(); S.pm.clear(); S.room = null; S.oldest = null; show('home');
}
function boot() {
  const cu = ls.get('cu', null); if (!cu) return;
  S.user = { id: cu.id }; S.lec = cu.lec; S.out = ls.get('ob', []);
  const c = ls.get('cache', null);
  if (c) { S.room = c.room; S.msgs = new Map(c.msgs.map(m => [m.id, m])); S.pins = new Map(c.pins.map(x => [x.id, x])); S.pm = new Map(c.pm.map(m => [m.id, m])); S.oldest = c.msgs[0]?.created_at || null; }
  $('#gear').classList.toggle('hide', !S.lec); show('chat'); setConn('CLOSED'); if (S.room) renderHead(); render(); connect();
}
setInterval(() => { if (S.user && navigator.onLine && (S.down || S.out.length)) S.down ? connect() : flush(); }, 10000);
boot();
</script>
